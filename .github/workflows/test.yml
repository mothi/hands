name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: wires suite
        run: python3 tests/test_wires.py
      - name: cli suite
        if: always()
        run: python3 tests/test_cli.py
      - name: seat suite
        if: always()
        run: python3 tests/test_seat.py
      - name: quota suite
        if: always()
        run: python3 tests/test_quota.py
