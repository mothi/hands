name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: hands selftest
        run: bash tests/selftest.sh
      - name: ACP suite
        run: python3 tests/test_acp.py
      - name: quota suite
        run: python3 tests/test_quota.py

  # Linux is untested; this job reports how far the suites get.
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: hands selftest
        run: bash tests/selftest.sh
      - name: ACP suite
        if: always()
        run: python3 tests/test_acp.py
      - name: quota suite
        if: always()
        run: python3 tests/test_quota.py
